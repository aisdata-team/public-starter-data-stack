name: checks

# Runs on every pull request, and again on every push to main. The push trigger is the one that
# matters for duplicate decision ids: two branches can each be clean on their own and only collide
# once both have merged (DECISIONS.md 2026-01-20).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Documentation checks
        run: python3 scripts/check_docs.py
      - name: Tests for the checks
        run: python3 -m unittest discover tests -v
